name: Check Links on Sui Docs

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  link-check:
    runs-on: ubuntu-latest
    
    steps:
      - name: Install linkinator
        run: npm install -g linkinator
      
      - name: Check links on docs.sui.io
        id: link-check
        run: |
          linkinator "https://docs.sui.io" \
            --recurse \
            --skip "linkedin.com|twitter.com|x.com|facebook.com|docs\.sui\.io/references/framework|docs\.sui\.io/references/sui-api/sui-graphql/beta/reference" \
            --retry \
            --timeout 10000 \
            --format json > link-report.json
        continue-on-error: true
      
      - name: Debug JSON structure
        if: always()
        run: |
          echo "=== JSON Report Structure ==="
          cat link-report.json | jq '.' | head -50
          echo "=== Checking for 'links' key ==="
          cat link-report.json | jq 'keys'
      
      - name: Generate summary
        id: summary
        if: always()
        run: |
          # Check if the file exists and has content
          if [ ! -s link-report.json ]; then
            echo "Error: link-report.json is empty or doesn't exist"
            echo "total=0" >> $GITHUB_OUTPUT
            echo "passed=0" >> $GITHUB_OUTPUT
            echo "broken=0" >> $GITHUB_OUTPUT
            echo "skipped=0" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Parse the JSON report - linkinator uses 'links' array
          TOTAL=$(jq '.links | length // 0' link-report.json)
          PASSED=$(jq '[.links[]? | select(.state == "OK")] | length // 0' link-report.json)
          BROKEN=$(jq '[.links[]? | select(.state == "BROKEN")] | length // 0' link-report.json)
          SKIPPED=$(jq '[.links[]? | select(.state == "SKIPPED")] | length // 0' link-report.json)
          
          echo "Debug - TOTAL: $TOTAL"
          echo "Debug - PASSED: $PASSED"
          echo "Debug - BROKEN: $BROKEN"
          echo "Debug - SKIPPED: $SKIPPED"
          
          echo "total=${TOTAL}" >> $GITHUB_OUTPUT
          echo "passed=${PASSED}" >> $GITHUB_OUTPUT
          echo "broken=${BROKEN}" >> $GITHUB_OUTPUT
          echo "skipped=${SKIPPED}" >> $GITHUB_OUTPUT
          
          # Extract broken links if any (with safe integer comparison)
          if [ "${BROKEN}" != "0" ] && [ -n "${BROKEN}" ]; then
            echo "Extracting broken links..."
            jq -r '[.links[]? | select(.state == "BROKEN") | "- [\(.url)](\(.url)) (Status: \(.status // "N/A"), Parent: \(.parent // "N/A"))"] | join("\n")' link-report.json > broken-links.txt || echo "No broken links found" > broken-links.txt
          else
            echo "No broken links to extract" > broken-links.txt
          fi
      
      - name: Upload full link report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: link-check-report-pr-${{ github.event.pull_request.number }}
          path: link-report.json
          retention-days: 30
      
      - name: Comment PR with results
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const fs = require('fs');
            const total = '${{ steps.summary.outputs.total }}' || '0';
            const passed = '${{ steps.summary.outputs.passed }}' || '0';
            const broken = '${{ steps.summary.outputs.broken }}' || '0';
            const skipped = '${{ steps.summary.outputs.skipped }}' || '0';
            const status = broken === '0' ? '✅' : '❌';
            
            let brokenLinksSection = '';
            if (broken !== '0' && fs.existsSync('broken-links.txt')) {
              const brokenLinks = fs.readFileSync('broken-links.txt', 'utf8').trim();
              if (brokenLinks && brokenLinks !== 'No broken links to extract') {
                const maxLength = 50000;
                const truncated = brokenLinks.length > maxLength 
                  ? brokenLinks.substring(0, maxLength) + '\n\n... (truncated, see full report in artifacts)'
                  : brokenLinks;
                brokenLinksSection = `\n### Broken Links\n\n${truncated}`;
              }
            }
            
            const comment = `## ${status} Link Check Results
            
            **Checked:** https://docs.sui.io  
            **Date:** ${new Date().toISOString()}
            
            ### Summary
            - **Total links checked:** ${total}
            - **Passed:** ${passed} ✅
            - **Broken:** ${broken} ❌
            - **Skipped:** ${skipped} ⏭️
            
            **Note:** Skipped checking framework reference and GraphQL reference pages
            ${brokenLinksSection}
            
            ---
            _Automated link check on production site. [Download full report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})_
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
      
      - name: Fail if broken links found
        if: steps.summary.outputs.broken != '0' && steps.summary.outputs.broken != ''
        run: |
          echo "❌ Broken links detected on docs.sui.io"
          echo "Found ${{ steps.summary.outputs.broken }} broken link(s)"
          exit 1
