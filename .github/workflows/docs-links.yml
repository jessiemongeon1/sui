name: Check Links on Sui Docs

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  link-check:
    runs-on: ubuntu-latest
    
    steps:
      - name: Install linkinator
        run: npm install -g linkinator
      
      - name: Check links on docs.sui.io
        id: link-check
        run: |
          linkinator "https://docs.sui.io" \
            --recurse \
            --skip "linkedin.com|twitter.com|x.com|facebook.com" \
            --retry \
            --timeout 10000 \
            --markdown > link-report.md
        continue-on-error: true
      
      - name: Read link report
        id: report
        if: always()
        run: |
          echo "report<<EOF" >> $GITHUB_OUTPUT
          cat link-report.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      
      - name: Comment PR with results
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const report = `${{ steps.report.outputs.report }}`;
            const status = '${{ steps.link-check.outcome }}' === 'success' ? '✅' : '❌';
            const comment = `## ${status} Link Check Results
            
            **Checked:** https://docs.sui.io
            **Date:** ${new Date().toISOString()}
            
            ${report}
            
            ---
            _Automated link check on production site_
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
      
      - name: Upload link report as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: link-check-report-pr-${{ github.event.pull_request.number }}
          path: link-report.md
          retention-days: 30
      
      - name: Fail if broken links found
        if: steps.link-check.outcome == 'failure'
        run: |
          echo "❌ Broken links detected on docs.sui.io"
          exit 1
